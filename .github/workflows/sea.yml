name: Update sea

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sea:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 sea/sea.py
      # keep only the latest image on the output branch so hourly updates don't pile up in history
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch --orphan output
          git add sea.svg
          git commit -m "Update sea"
          git push --force origin output
